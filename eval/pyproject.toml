[project]
name = "bench"
version = "0.1.0"
description = "Evaluation harness for durable-researcher against ResearchRubrics and DRACO benchmarks"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.42",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "huggingface-hub>=0.23",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
bench = "bench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
